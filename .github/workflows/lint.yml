name: Lint

# Lightweight checks: validate JSON files and JavaScript syntax.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "checking $f"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" || fail=1
          done < <(find . -name '*.json' -not -path './.git/*')
          exit $fail

      - name: Check JS syntax
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "checking $f"
            node --check "$f" || fail=1
          done < <(find chrome-extensions skills \( -name '*.js' -o -name '*.mjs' \) -type f 2>/dev/null | sort -u)
          exit $fail

      - name: Education and Excel regression tests
        run: node --test tests/*.test.mjs

      - name: Packaging and Excel file tests
        run: |
          python tests/package_test.py
          python tests/excel_test.py
